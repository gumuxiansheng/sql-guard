# 跨编译配置（仅在交叉编译时使用，不影响本机构建）
# 重要：在 stable 工具链上，link-self-contained 仅 y/yes/on/n/no/off/-linker 为稳定取值；
#       带 + 的细粒度写法（+mingw / +linker,...）仍属 unstable，需要 -Z unstable-options。
#       因此这里统一用稳定写法 yes（= 全部自包含），既能自包含、又不必依赖 nightly。

# Linux x86_64 (musl, 静态链接，self-contained)
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]

# Linux aarch64 (musl, 静态链接，self-contained)
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]

# Windows x86_64 (self-contained mingw)
# 注意：rustc 的 windows-gnu 链接流程会**显式调用 `dlltool`** 生成导入库，
# 与选用哪个链接器无关，因此必须安装 mingw-w64 工具链（见 build-release.sh 的
# apt-get gcc-mingw-w64-x86-64，提供 x86_64-w64-mingw32-dlltool/gcc/ld 与 CRT 启动对象）。
# 这里用默认 mingw gcc 链接器，配合 link-self-contained=yes 使用 rust 自带的 Windows API 导入库。
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-self-contained=yes"]
