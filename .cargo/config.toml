# 跨编译配置（仅在交叉编译时使用，不影响本机构建）
# 重要：在 stable 工具链上，link-self-contained 仅 y/yes/on/n/no/off/-linker 为稳定取值；
#       带 + 的细粒度写法（+mingw / +linker,...）仍属 unstable，需要 -Z unstable-options。
#       因此这里统一用稳定写法 yes（= 全部自包含），既能自包含、又不必依赖 nightly。

# Linux x86_64 (musl, 静态链接，self-contained)
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]

# Linux aarch64 (musl, 静态链接，self-contained)
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]

# Windows x86_64 (self-contained mingw)
[target.x86_64-pc-windows-gnu]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]
