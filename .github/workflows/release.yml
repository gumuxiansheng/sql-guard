# Release 工作流：打 tag 时构建跨平台二进制并上传到 GitHub Releases。
#
# 触发：推送 `v*` 格式 tag（如 `v0.1.0`、`v0.2.0-rc1`）。
# 产物：
#   - sqlguard-x86_64-unknown-linux-musl        (静态链接，无 glibc 依赖)
#   - sqlguard-aarch64-unknown-linux-musl       (ARM64 Linux)
#   - sqlguard-x86_64-apple-darwin              (Intel macOS)
#   - sqlguard-aarch64-apple-darwin             (Apple Silicon macOS)
#   - sqlguard-x86_64-pc-windows-gnu.exe        (Windows)
#
# 制品保留：构建产物先以 GitHub Actions Artifact 形式随运行保留（默认 90 天），
#           随后由下方 release 作业作为「永久 Release 资产」发布，可长期下载。
# 体积优化见 Cargo.toml [profile.release]（lto=fat / codegen-units=1 / strip / panic=abort）。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 上传 Release 资产必需

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: sqlguard-x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: sqlguard-aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: sqlguard-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sqlguard-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact: sqlguard-x86_64-pc-windows-gnu.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # aarch64-musl 交叉编译需要 aarch64 版 musl C 交叉编译器（psm 等 C 依赖需要）；
      # 宿主的 musl-tools 只提供 x86_64 的 musl-gcc，故从这里拉取预构建的 aarch64 交叉工具链。
      # 仅设置 CC（C 编译用），链接仍走 .cargo/config.toml 的 rust-lld + link-self-contained（与 CNB 一致）。
      - name: Install aarch64-linux-musl cross toolchain (Linux only)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          curl -fsSL https://musl.cc/aarch64-linux-musl-cross.tgz -o /tmp/aarch64-musl.tgz
          tar -xf /tmp/aarch64-musl.tgz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/sqlguard.exe dist/${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/sqlguard dist/${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # 制品名带版本号，便于在不同 tag 的构建运行中区分/追溯；
          # 该 Artifact 随工作流运行保留（retention-days 为 Free 版上限 90 天），
          # 同时下方 release 作业会将其作为永久 Release 资产发布。
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: dist/${{ matrix.artifact }}
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
