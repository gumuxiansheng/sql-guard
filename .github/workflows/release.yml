# Release 工作流：打 tag 时构建跨平台二进制并上传到 GitHub Releases。
#
# 触发：推送 `v*` 格式 tag（如 `v0.1.0`、`v0.2.0-rc1`）。
# 产物：
#   - sqlguard-x86_64-unknown-linux-musl        (静态链接，无 glibc 依赖)
#   - sqlguard-aarch64-unknown-linux-musl       (ARM64 Linux)
#   - sqlguard-x86_64-apple-darwin              (Intel macOS)
#   - sqlguard-aarch64-apple-darwin             (Apple Silicon macOS)
#   - sqlguard-x86_64-pc-windows-gnu.exe        (Windows)
#   （上述每个目标均同时产出 sqlguard 与 sqlguard-mine 两个二进制，与 CNB .cnb.yml 对齐；
#     Rust 工具链与 CNB 流水线一致使用 stable。）
#
# 制品保留：构建产物先以 GitHub Actions Artifact 形式随运行保留（默认 90 天），
#           随后由下方 release 作业作为「永久 Release 资产」发布，可长期下载。
# 体积优化见 Cargo.toml [profile.release]（lto=fat / codegen-units=1 / strip / panic=abort）。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 上传 Release 资产必需

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: sqlguard-x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: sqlguard-aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: sqlguard-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sqlguard-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact: sqlguard-x86_64-pc-windows-gnu.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # aarch64-musl 交叉编译需要 aarch64 版 C 交叉编译器（psm 等 C 依赖需要）；
      # 宿主的 musl-tools 只提供 x86_64 的 musl-gcc。
      # 与 CNB 流水线 scripts/build-release.sh（make_zig_cc）一致的方案：
      # 用 Zig 作交叉 C 编译器，但创建名称不含 "zig" 的 aarch64-linux-musl-gcc
      # 封装脚本，让 cc crate 当作普通 GCC 处理，绕过其有缺陷的 zig 探测
      # （cc crate 会追加 4 段 --target=aarch64-unknown-linux-musl，Zig 0.13
      # 无法解析，报 UnknownOperatingSystem）。封装脚本丢弃 4 段目标参数，
      # 末尾补上 Zig 能接受的 3 段 -target aarch64-linux-musl。
      # 链接仍走 .cargo/config.toml 的 rust-lld + link-self-contained。
      - name: Install Zig (cross C compiler)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Create aarch64-musl C compiler wrapper
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          cat > /usr/local/bin/aarch64-linux-musl-gcc <<'ZIGWRAP'
          #!/bin/sh
          zig_args=""
          while [ $# -gt 0 ]; do
            case "$1" in
              -target|--target)     shift 2 ;;
              -target=*|--target=*) shift ;;
              *) zig_args="$zig_args $1"; shift ;;
            esac
          done
          exec zig cc $zig_args -target aarch64-linux-musl
          ZIGWRAP
          chmod +x /usr/local/bin/aarch64-linux-musl-gcc

      - name: Set CC for aarch64-musl
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Rename binaries (sqlguard + sqlguard-mine)
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            ext=".exe"
          fi
          cp "target/${{ matrix.target }}/release/sqlguard${ext}"      "dist/${{ matrix.artifact }}"
          cp "target/${{ matrix.target }}/release/sqlguard-mine${ext}" "dist/sqlguard-mine-${{ matrix.target }}${ext}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # 制品名带版本号，便于在不同 tag 的构建运行中区分/追溯；
          # 该 Artifact 随工作流运行保留（retention-days 为 Free 版上限 90 天），
          # 同时下方 release 作业会将其作为永久 Release 资产发布。
          # 路径为 dist/*：同一目标的两个二进制（sqlguard / sqlguard-mine）一并上传。
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: dist/*
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
