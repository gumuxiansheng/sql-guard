# Release 工作流：打 tag 时构建跨平台二进制并上传到 GitHub Releases。
#
# 触发：推送 `v*` 格式 tag（如 `v0.1.0`、`v0.2.0-rc1`）。
# 产物：
#   - sqlguard-x86_64-unknown-linux-musl        (静态链接，无 glibc 依赖)
#   - sqlguard-aarch64-unknown-linux-musl       (ARM64 Linux)
#   - sqlguard-x86_64-apple-darwin              (Intel macOS)
#   - sqlguard-aarch64-apple-darwin             (Apple Silicon macOS)
#   - sqlguard-x86_64-pc-windows-gnu.exe        (Windows)
#
# 体积优化见 Cargo.toml [profile.release]（lto=fat / codegen-units=1 / strip / panic=abort）。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 上传 Release 资产必需

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: sqlguard-x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: sqlguard-aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: sqlguard-x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sqlguard-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact: sqlguard-x86_64-pc-windows-gnu.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/sqlguard.exe dist/${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/sqlguard dist/${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
