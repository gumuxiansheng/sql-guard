# CI 工作流：PR 合入与推送主干时自动运行测试，作为发版前的测试门禁。
#
# 触发：推送到 main/master 分支、或针对 main/master 的 PR。
# 产物：无（仅校验）。
#
# 与 release.yml 的分工：
#   - ci.yml：每次代码变更跑测试 + clippy + fmt 检查，保障主干质量
#   - release.yml：仅在 v* tag 推送时构建跨平台二进制
name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust-test:
    name: Rust test + clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets --locked

      - name: Run unit + integration tests
        run: cargo test --all-targets --locked

  java-test:
    name: Java replay test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: replay
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run Maven tests
        run: mvn -B test
