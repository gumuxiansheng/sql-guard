# ================================================================================
# 基础类规则包 `rules-core` 清单（通用规则，与数据库方言/团队约定无关）
# ================================================================================
# 规则分层（方案 A：基础类 + 定制类分开分发）：
#   config/rules-core/      ← 基础类包根（本清单所在目录）
#   config/rules-gaussdb/   ← 定制类包根（GaussDB 规范，namespace = "gaussdb"）
# 包根内结构：
#   rules-pack.toml           ← 本清单
#   rules/ddl/*.rhai          ← 规则脚本（script_path 相对包根解析）
#   rules/dml/*.rhai
#   lib/helpers.rhai          ← 引擎内置 helpers（故此处不声明 [pack].helpers）
#
# 用法：
#   1. `sqlguard init --with-default-pack` 会把基础包与定制包一起 vendor 到
#      项目 vendor/rules/ 下；
#   2. 也可把包目录复制/检出后独立版本化、独立 CI（见 docs/rule-pack-design.md
#      §十二 迁移指南）。
#
# ★ 收录标准：与具体数据库、团队约定无关的通用规范才允许进入本包；
#   方言/平台相关规则一律放定制包（如 rules-gaussdb）。
# ★ 规则内容与 sqlguard.rules.toml.example 保持同步（有守护测试）。
# ================================================================================

[pack]
name        = "rules-core"
version     = "1.0.0"
api_version = 1
engine      = ">=0.2.7 <0.3"
description = "SqlGuard 基础规则集（通用 DDL/DML 规范，与数据库方言无关）"
license     = "MIT"

[[rules]]
id = "DDL001"
name = "no_drop_table"
group = "ddl-safety"
description = "Disallow DROP TABLE in DDL scripts"
enabled = true
script_path = "rules/ddl/no_drop_table.rhai"
applies_to = ["ddl"]
severity = "error"

[[rules]]
id = "DDL002"
name = "primary_key_required"
group = "ddl-safety"
description = "CREATE TABLE must have a PRIMARY KEY"
enabled = true
script_path = "rules/ddl/primary_key_required.rhai"
applies_to = ["ddl"]
severity = "warning"

[[rules]]
id = "DDL003"
name = "no_reserved_keyword_naming"
group = "ddl-safety"
description = "Database object names must not use SQL reserved keywords"
enabled = true
script_path = "rules/ddl/no_reserved_keyword_naming.rhai"
applies_to = ["ddl"]
severity = "error"

[[rules]]
id = "DDL004"
name = "backup_table_naming"
group = "ddl-convention"
description = "Backup tables created via CREATE TABLE AS SELECT must be prefixed with 'bks_'"
enabled = true
script_path = "rules/ddl/backup_table_naming.rhai"
applies_to = ["ddl"]
severity = "warning"

[[rules]]
id = "DDL005"
name = "index_naming_convention"
group = "ddl-convention"
description = "Indexes follow idx_/uk_/pk_ naming convention based on type and columns"
enabled = true
script_path = "rules/ddl/index_naming_convention.rhai"
applies_to = ["ddl"]
severity = "warning"

[[rules]]
id = "DDL006"
name = "no_redundant_index"
group = "ddl-performance"
description = "Avoid redundant indexes (duplicate PK indexes and leftmost-prefix duplicates)"
enabled = true
script_path = "rules/ddl/no_redundant_index.rhai"
applies_to = ["ddl"]
severity = "warning"

[[rules]]
id = "DDL007"
name = "table_name_naming"
group = "ddl-convention"
description = "Table names must contain only lowercase letters, digits, and underscores, and must not start with a digit"
enabled = true
script_path = "rules/ddl/table_name_naming.rhai"
applies_to = ["ddl"]
severity = "warning"

[[rules]]
id = "DML001"
name = "no_select_all"
group = "dml-safety"
description = "Disallow SELECT * in DML scripts"
enabled = true
script_path = "rules/dml/no_select_all.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML002"
name = "no_delete_update_without_where"
group = "dml-safety"
description = "DELETE/UPDATE must have a WHERE clause"
enabled = true
script_path = "rules/dml/no_delete_update_without_where.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML003"
name = "insert_columns_required"
group = "dml-safety"
description = "INSERT must specify target columns"
enabled = true
script_path = "rules/dml/insert_columns_required.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML004"
name = "subquery_alias_required"
group = "dml-style"
description = "Subqueries in FROM must have an alias"
enabled = true
script_path = "rules/dml/subquery_alias_required.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML005"
name = "column_references_qualified"
group = "dml-style"
description = "Qualify column references with table name in multi-table queries"
enabled = true
script_path = "rules/dml/column_references_qualified.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML006"
name = "no_join_without_condition"
group = "dml-safety"
description = "JOIN must have ON or USING condition"
enabled = true
script_path = "rules/dml/no_join_without_condition.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML007"
name = "order_by_required_for_pagination"
group = "dml-safety"
description = "Pagination (LIMIT/OFFSET/FETCH) must have ORDER BY to keep result order deterministic"
enabled = true
script_path = "rules/dml/order_by_required_for_pagination.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML101"
name = "no_unused_join"
group = "dml-performance"
description = "Detect potentially unused JOINs"
enabled = false
script_path = "rules/dml/no_unused_join.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML102"
name = "no_unused_cte"
group = "dml-performance"
description = "Detect unused CTEs (WITH clauses)"
enabled = false
script_path = "rules/dml/no_unused_cte.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML103"
name = "use_is_null"
group = "dml-convention"
description = "Use IS NULL instead of = NULL"
enabled = false
script_path = "rules/dml/use_is_null.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML104"
name = "use_coalesce"
group = "dml-convention"
description = "Use standard COALESCE instead of NVL/ISNULL"
enabled = false
script_path = "rules/dml/use_coalesce.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML105"
name = "no_order_by_in_subquery"
group = "dml-performance"
description = "ORDER BY in subquery is typically ignored"
enabled = false
script_path = "rules/dml/no_order_by_in_subquery.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML106"
name = "union_all_preferred"
group = "dml-performance"
description = "Prefer UNION ALL over UNION unless dedup needed"
enabled = false
script_path = "rules/dml/union_all_preferred.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML107"
name = "no_nested_case"
group = "dml-convention"
description = "Avoid nested CASE expressions"
enabled = false
script_path = "rules/dml/no_nested_case.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML108"
name = "no_constant_where"
group = "dml-convention"
description = "Avoid constant/tautology conditions in WHERE clause (e.g. 1=1, 2=2, 'a'='a', TRUE)"
enabled = true
script_path = "rules/dml/no_constant_where.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML109"
name = "join_type_required"
group = "dml-style"
description = "JOIN must specify an explicit type (e.g. LEFT JOIN or INNER JOIN); bare JOIN is not allowed"
enabled = true
script_path = "rules/dml/join_type_required.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML110"
name = "max_join_tables"
group = "dml-performance"
description = "A query must not join more than 5 tables"
enabled = true
script_path = "rules/dml/max_join_tables.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML111"
name = "no_or_in_where"
group = "dml-performance"
description = "Do not use OR to combine conditions in WHERE; prefer IN, UNION ALL, or splitting the query"
enabled = true
script_path = "rules/dml/no_or_in_where.rhai"
applies_to = ["dml"]
severity = "warning"
