# ================================================================================
# 默认规则包 `rules-core` 清单（规则与引擎分开发版）
# ================================================================================
# 本文件使仓库 `config/` 目录成为一个合规的规则包根：
#   config/rules-pack.toml           ← 本清单
#   config/rules/ddl/*.rhai          ← 规则脚本（script_path 相对包根解析）
#   config/rules/lib/helpers.rhai    ← 引擎内置 helpers（故此处不声明 [pack].helpers）
#
# 用法：
#   1. `sqlguard init --with-default-pack` 会把它 vendor 到项目 vendor/rules/rules-core/；
#   2. 也可把整个包目录复制到独立规则仓库后独立版本化、独立 CI（见
#      docs/rule-pack-design.md §十二 迁移指南）。
#
# ★ 规则内容与 sqlguard.rules.toml.example 保持同步（有守护测试）。
# ================================================================================

[pack]
name        = "rules-core"
version     = "1.0.0"
api_version = 1
engine      = ">=0.2.7 <0.3"
description = "SqlGuard 默认规则集（DDL/DML 基础规范 + GaussDB 规范条目）"
license     = "MIT"
[[rules]]
id = "DDL001"
name = "no_drop_table"
group = "ddl-safety"
description = "Disallow DROP TABLE in DDL scripts"
enabled = true
script_path = "rules/ddl/no_drop_table.rhai"
applies_to = ["ddl"]
severity = "error"

[[rules]]
id = "DDL002"
name = "primary_key_required"
group = "ddl-safety"
description = "CREATE TABLE must have a PRIMARY KEY"
enabled = true
script_path = "rules/ddl/primary_key_required.rhai"
applies_to = ["ddl"]
severity = "warning"

[[rules]]
id = "DDL003"
name = "no_reserved_keyword_naming"
group = "ddl-safety"
description = "Database object names must not use SQL reserved keywords"
enabled = true
script_path = "rules/ddl/no_reserved_keyword_naming.rhai"
applies_to = ["ddl"]
severity = "error"

[[rules]]
id = "DDL004"
name = "backup_table_naming"
group = "ddl-convention"
description = "Backup tables created via CREATE TABLE AS SELECT must be prefixed with 'bks_'"
enabled = true
script_path = "rules/ddl/backup_table_naming.rhai"
applies_to = ["ddl"]
severity = "warning"

[[rules]]
id = "DDL005"
name = "index_naming_convention"
group = "ddl-convention"
description = "Indexes follow idx_/uk_/pk_ naming convention based on type and columns"
enabled = true
script_path = "rules/ddl/index_naming_convention.rhai"
applies_to = ["ddl"]
severity = "warning"

[[rules]]
id = "DDL006"
name = "no_redundant_index"
group = "ddl-performance"
description = "Avoid redundant indexes (duplicate PK indexes and leftmost-prefix duplicates)"
enabled = true
script_path = "rules/ddl/no_redundant_index.rhai"
applies_to = ["ddl"]
severity = "warning"

[[rules]]
id = "DDL007"
name = "table_name_naming"
group = "ddl-convention"
description = "Table names must contain only lowercase letters, digits, and underscores, and must not start with a digit"
enabled = true
script_path = "rules/ddl/table_name_naming.rhai"
applies_to = ["ddl"]
severity = "warning"

[[rules]]
id = "DML001"
name = "no_select_all"
group = "dml-safety"
description = "Disallow SELECT * in DML scripts"
enabled = true
script_path = "rules/dml/no_select_all.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML002"
name = "no_delete_update_without_where"
group = "dml-safety"
description = "DELETE/UPDATE must have a WHERE clause"
enabled = true
script_path = "rules/dml/no_delete_update_without_where.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML003"
name = "insert_columns_required"
group = "dml-safety"
description = "INSERT must specify target columns"
enabled = true
script_path = "rules/dml/insert_columns_required.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML004"
name = "subquery_alias_required"
group = "dml-style"
description = "Subqueries in FROM must have an alias"
enabled = true
script_path = "rules/dml/subquery_alias_required.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML005"
name = "column_references_qualified"
group = "dml-style"
description = "Qualify column references with table name in multi-table queries"
enabled = true
script_path = "rules/dml/column_references_qualified.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML006"
name = "no_join_without_condition"
group = "dml-safety"
description = "JOIN must have ON or USING condition"
enabled = true
script_path = "rules/dml/no_join_without_condition.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML007"
name = "order_by_required_for_pagination"
group = "dml-safety"
description = "Pagination (LIMIT/OFFSET/FETCH) must have ORDER BY to keep result order deterministic"
enabled = true
script_path = "rules/dml/order_by_required_for_pagination.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML101"
name = "no_unused_join"
group = "dml-performance"
description = "Detect potentially unused JOINs"
enabled = false
script_path = "rules/dml/no_unused_join.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML102"
name = "no_unused_cte"
group = "dml-performance"
description = "Detect unused CTEs (WITH clauses)"
enabled = false
script_path = "rules/dml/no_unused_cte.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML103"
name = "use_is_null"
group = "dml-convention"
description = "Use IS NULL instead of = NULL"
enabled = false
script_path = "rules/dml/use_is_null.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "DML104"
name = "use_coalesce"
group = "dml-convention"
description = "Use standard COALESCE instead of NVL/ISNULL"
enabled = false
script_path = "rules/dml/use_coalesce.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML105"
name = "no_order_by_in_subquery"
group = "dml-performance"
description = "ORDER BY in subquery is typically ignored"
enabled = false
script_path = "rules/dml/no_order_by_in_subquery.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML106"
name = "union_all_preferred"
group = "dml-performance"
description = "Prefer UNION ALL over UNION unless dedup needed"
enabled = false
script_path = "rules/dml/union_all_preferred.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML107"
name = "no_nested_case"
group = "dml-convention"
description = "Avoid nested CASE expressions"
enabled = false
script_path = "rules/dml/no_nested_case.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML108"
name = "no_constant_where"
group = "dml-convention"
description = "Avoid constant/tautology conditions in WHERE clause (e.g. 1=1, 2=2, 'a'='a', TRUE)"
enabled = true
script_path = "rules/dml/no_constant_where.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML109"
name = "join_type_required"
group = "dml-style"
description = "JOIN must specify an explicit type (e.g. LEFT JOIN or INNER JOIN); bare JOIN is not allowed"
enabled = true
script_path = "rules/dml/join_type_required.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML110"
name = "max_join_tables"
group = "dml-performance"
description = "A query must not join more than 5 tables"
enabled = true
script_path = "rules/dml/max_join_tables.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "DML111"
name = "no_or_in_where"
group = "dml-performance"
description = "Do not use OR to combine conditions in WHERE; prefer IN, UNION ALL, or splitting the query"
enabled = true
script_path = "rules/dml/no_or_in_where.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "GNAM001"
name = "gaussdb_object_name_charset"
group = "gaussdb-naming"
description = "Object names must contain only letters, digits and underscores"
enabled = false
script_path = "rules/ddl/gaussdb_object_name_charset.rhai"
applies_to = ["ddl"]
severity = "error"

[[rules]]
id = "GNAM002"
name = "gaussdb_no_quoted_object_name"
group = "gaussdb-naming"
description = "Do not define object names with double quotes"
enabled = false
script_path = "rules/ddl/gaussdb_no_quoted_object_name.rhai"
applies_to = ["ddl"]
severity = "error"

[[rules]]
id = "GNAM003"
name = "gaussdb_no_reserved_prefix"
group = "gaussdb-naming"
description = "Object names must not use the system-reserved prefixes pg_/gs_/adm_/my_/db_"
enabled = false
script_path = "rules/ddl/gaussdb_no_reserved_prefix.rhai"
applies_to = ["ddl"]
severity = "error"

[[rules]]
id = "GNAM004"
name = "gaussdb_object_name_max_bytes"
group = "gaussdb-naming"
description = "Object names must not exceed 63 bytes"
enabled = false
script_path = "rules/ddl/gaussdb_object_name_max_bytes.rhai"
applies_to = ["ddl"]
severity = "error"

[rules.params]
name_max_bytes = 63

[[rules]]
id = "GTYP001"
name = "gaussdb_max_large_fields"
group = "gaussdb-type"
description = "A table should not have more than 8 large fields"
enabled = false
script_path = "rules/ddl/gaussdb_max_large_fields.rhai"
applies_to = ["ddl"]
severity = "warning"

[rules.params]
max_large_fields = 8
large_field_bytes = 2000

[[rules]]
id = "GTYP002"
name = "gaussdb_no_system_column"
group = "gaussdb-type"
description = "Do not use CTID/CID/OID/XID/TID/XMIN/CMIN/XMAX/CMAX as business columns"
enabled = false
script_path = "rules/ddl/gaussdb_no_system_column.rhai"
applies_to = ["ddl"]
severity = "error"

[[rules]]
id = "GTYP003"
name = "gaussdb_recommended_data_types"
group = "gaussdb-type"
description = "Prefer the recommended basic data types from the specification appendix"
enabled = false
script_path = "rules/ddl/gaussdb_recommended_data_types.rhai"
applies_to = ["ddl"]
severity = "warning"

[[rules]]
id = "GOBJ001"
name = "gaussdb_no_materialized_view"
group = "gaussdb-object"
description = "Materialized views are not allowed"
enabled = false
script_path = "rules/ddl/gaussdb_no_materialized_view.rhai"
applies_to = ["ddl"]
severity = "error"

[[rules]]
id = "GOBJ002"
name = "gaussdb_no_order_by_in_view"
group = "gaussdb-object"
description = "ORDER BY is not allowed inside a view definition"
enabled = false
script_path = "rules/ddl/gaussdb_no_order_by_in_view.rhai"
applies_to = ["ddl"]
severity = "error"

[[rules]]
id = "GOBJ003"
name = "gaussdb_view_usage_warning"
group = "gaussdb-object"
description = "Views are discouraged (and nested views especially so)"
enabled = false
script_path = "rules/ddl/gaussdb_view_usage_warning.rhai"
applies_to = ["ddl"]
severity = "warning"

[[rules]]
id = "GIDX001"
name = "gaussdb_create_index_concurrently"
group = "gaussdb-index"
description = "CREATE INDEX must use CONCURRENTLY when online transactions exist"
enabled = false
script_path = "rules/ddl/gaussdb_create_index_concurrently.rhai"
applies_to = ["ddl"]
severity = "error"

[[rules]]
id = "GDCL001"
name = "gaussdb_no_quoted_column_in_ddl"
group = "gaussdb-ddl"
description = "Column names in DDL must not be wrapped in quotes or backticks"
enabled = false
script_path = "rules/ddl/gaussdb_no_quoted_column_in_ddl.rhai"
applies_to = ["ddl"]
severity = "error"

[[rules]]
id = "GDDL001"
name = "gaussdb_require_commit_in_transaction"
group = "gaussdb-ddl"
description = "DDL inside a transaction requires an explicit COMMIT/ROLLBACK"
enabled = false
script_path = "rules/ddl/gaussdb_require_commit_in_transaction.rhai"
applies_to = ["ddl"]
severity = "error"

[[rules]]
id = "GDML002"
name = "gaussdb_no_order_by_group_by_in_update"
group = "gaussdb-dml"
description = "UPDATE must not use ORDER BY or GROUP BY"
enabled = false
script_path = "rules/dml/gaussdb_no_order_by_group_by_in_update.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "GDML003"
name = "gaussdb_no_order_by_group_by_in_delete"
group = "gaussdb-dml"
description = "DELETE must not use ORDER BY or GROUP BY"
enabled = false
script_path = "rules/dml/gaussdb_no_order_by_group_by_in_delete.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "GDML004"
name = "gaussdb_update_subquery_to_join"
group = "gaussdb-dml"
description = "UPDATE ... WHERE with a subquery should be rewritten as JOIN"
enabled = false
script_path = "rules/dml/gaussdb_update_subquery_to_join.rhai"
applies_to = ["dml"]
severity = "warning"

[[rules]]
id = "GDML005"
name = "gaussdb_order_by_explicit_sort"
group = "gaussdb-dml"
description = "ORDER BY must specify ASC/DESC and NULLS FIRST/LAST explicitly"
enabled = false
script_path = "rules/dml/gaussdb_order_by_explicit_sort.rhai"
applies_to = ["dml"]
severity = "error"

[[rules]]
id = "GPERF001"
name = "gaussdb_statement_max_bytes"
group = "gaussdb-performance"
description = "A single statement should stay under 5KB"
enabled = false
script_path = "rules/dml/gaussdb_statement_max_bytes.rhai"
applies_to = ["ddl", "dml"]
severity = "warning"

[rules.params]
stmt_max_bytes = 5120
