[package]
name = "sqlguard"
version = "0.2.5"
edition = "2021"
description = "A SQL script checking tool with customizable rules engine for CI/CD pipelines"

[dependencies]
# 依赖版本锁定到 minor 版本，避免 major 版本漂移引入破坏性变更。
# Cargo.lock 仍锁定具体 patch 版本，确保 CI 可复现。
clap = { version = "3.2", features = ["derive"] }
encoding_rs = "0.8"
rhai = "1.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
globset = "0.4"
walkdir = "2"
anyhow = "1.0"
colored = "2"
sqlparser = "0.60"
quick-xml = "0.31"

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

# 基准测试：cargo bench --bench rule_engine
[[bench]]
name = "rule_engine"
harness = false

# Release 构建优化：显著减小二进制体积
# - lto = "fat": 跨 crate 全链接优化，去除跨 crate 死代码（慢但小）
# - codegen-units = 1: 单代码生成单元，让 LLVM 全局优化
# - strip = true: 剥离调试符号（单独的 dsym 仍保留调试信息）
# - panic = "abort": 去除 unwind 代码
# 注：如需调试 release 版本，临时注释掉 strip / panic = "abort"
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# ===== 多二进制：主 linter 与独立挖掘工具共享 lib，互不链入对方代码 =====
[[bin]]
name = "sqlguard"
path = "src/main.rs"

[[bin]]
name = "sqlguard-mine"
path = "src/bin/sqlguard-mine.rs"
